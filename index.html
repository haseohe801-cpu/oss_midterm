<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>캠퍼스 기자재 대여 관리</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
<main class="container my-4">
  <h1>캠퍼스 기자재 대여 관리</h1>
  <p>기자재를 등록하고 대여 및 반납 상태를 관리합니다.</p>
  <section id="registration" class="panel mb-4">
    <h2>대여 정보 등록</h2>
    <form id="loanForm">
      <div class="mb-3">
        <label for="borrower">대여자</label>
        <input id="borrower" name="borrower" type="text" required>
      </div>
      <div class="mb-3">
        <label for="equipment">기자재명</label>
        <input id="equipment" name="equipment" type="text" required>
      </div>
      <!-- TODO Q3-A: 분류 select, 반납예정일 date 입력 요소 작성 -->
      <button type="submit" id="addBtn">대여 등록</button>
    </form>
    <p id="message" aria-live="polite"></p>
  </section>
  <section class="panel">
    <h2>대여 현황</h2>
    <!-- TODO Q5-A: 분류 필터 select 추가 (id="categoryFilter") -->
    <div class="table-responsive">
      <table id="loanTable">
        <thead><tr><th>번호</th><th>대여자</th><th>기자재</th><th>분류</th><th>반납예정일</th><th>상태</th><th>관리</th></tr></thead>
        <tbody id="loanRows"></tbody>
      </table>
    </div>
    <p id="summary"></p>
  </section>
</main>
</body>
</html>
